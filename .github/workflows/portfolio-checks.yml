name: Portfolio static checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check portfolio-proof-lab.js
          node --check case-studies.js
          node --check marketing-campaign.js
          node --check knowledge-monitor.js
          node --check examples/compare-consolidations.example.js
      - name: Check sample data and links
        run: |
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('examples/regulatory-watch.sample.json','utf8'));if(j.regulations.length!==3)process.exit(1);"
          node -e "const f=require('fs');const h=f.readFileSync('case-studies.html','utf8');for(const p of ['case-studies.css','case-studies.js'])if(!h.includes(p)||!f.existsSync(p))process.exit(1);"
          node -e "const f=require('fs');const h=f.readFileSync('index.html','utf8');for(const p of ['creative','knowledge','reintegration'])if(!h.includes('data-casebook=\"'+p+'\"'))process.exit(1);"

      - name: Check complete marketing campaign showcase
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('marketing-campaign-data.json','utf8'));const langs=Object.entries(c.languages);if(langs.length!==14||c.formats.length!==8||c.campaign.pages.length!==9)throw Error('Unexpected campaign inventory');for(const [l,d] of langs){if(Object.keys(d.pieces).length!==9||!d.feature00?.frontBackLine1)throw Error(l+' incomplete copy')}if(c.languages.ar.dir!=='rtl')throw Error('RTL missing');"
          node -e "const fs=require('fs');const h=fs.readFileSync('marketing-campaign.html','utf8');for(const f of ['marketing-campaign.css','marketing-campaign.js','marketing-campaign-data.json','marketing-assets/front.jpeg','marketing-assets/ingredients.jpeg','marketing-assets/app-home-es.jpeg','marketing-assets/app-results-es.jpeg','marketing-assets/robot-pointing.png'])if(!fs.existsSync(f))throw Error('Missing '+f);if(!h.includes('campaign-gallery'))throw Error('Campaign view missing');"

      - name: Verify Creative Studio campaign proof
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('portfolio-proof-lab.js','utf8');for(const s of ['proof-campaign-card','./marketing-assets/','front.jpeg','ingredients.jpeg','app-results-es.jpeg','campaignSourceText'])if(!x.includes(s))throw Error('Missing '+s);for(const f of ['marketing-assets/front.jpeg','marketing-assets/ingredients.jpeg','marketing-assets/app-home-es.jpeg','marketing-assets/app-results-es.jpeg','marketing-assets/robot-pointing.png','marketing-assets/robot-magnifier.png'])if(!fs.existsSync(f))throw Error('Missing '+f);"

      - name: Verify actual documentary monitoring case
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('knowledge-monitor-snapshot.json','utf8'));if(d.total_monitored!==231||d.daily_results.length!==3||d.events.length!==16||d.editorial_events!==16||d.exclusions!==114)throw Error('Unexpected monitored totals');if(d.active_coverage.reduce((n,x)=>n+x.count,0)!==231)throw Error('Coverage mismatch');if(d.daily_results.some(x=>x.unchanged+x.new+x.failed!==231))throw Error('Invalid run summary');"
          node -e "const fs=require('fs');for(const f of ['knowledge-monitor.html','knowledge-monitor.css','knowledge-monitor.js','knowledge-monitor-snapshot.json'])if(!fs.existsSync(f))throw Error('Missing '+f);const s=fs.readFileSync('index.html','utf8');if(!s.includes('knowledge-monitor.html'))throw Error('Knowledge monitor not linked');"
