name: Portfolio static checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check portfolio-proof-lab.js
          node --check case-studies.js
          node --check examples/compare-consolidations.example.js
      - name: Check sample data and links
        run: |
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('examples/regulatory-watch.sample.json','utf8'));if(j.regulations.length!==3)process.exit(1);"
          node -e "const f=require('fs');const h=f.readFileSync('case-studies.html','utf8');for(const p of ['case-studies.css','case-studies.js'])if(!h.includes(p)||!f.existsSync(p))process.exit(1);"
          node -e "const f=require('fs');const h=f.readFileSync('index.html','utf8');for(const p of ['creative','knowledge','reintegration'])if(!h.includes('data-casebook=\"'+p+'\"'))process.exit(1);"
